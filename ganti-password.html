<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://teuqxfwqntkgemyukiju.supabase.co wss://teuqxfwqntkgemyukiju.supabase.co; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ganti password — Inside TKJ 4</title>
<style>
body{font:15px system-ui;background:#f5f7fb;color:#18233c;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{background:white;border:1px solid #e6ebf4;border-radius:22px;padding:28px;max-width:430px;width:100%}
h1{margin:0 0 8px}
p{color:#71809b;line-height:1.7}
label{display:block;font-weight:700;margin:16px 0 6px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5f0;border-radius:11px;font:inherit}
button{width:100%;border:0;border-radius:11px;background:#4263eb;color:white;font-weight:800;padding:13px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.6}
a{color:#4263eb}
#status{font-size:13px;line-height:1.5;color:#a23b3b}
#status.ok{color:#166c4c}
body.theme-dark{color-scheme:dark;background:#0b1220;color:#e7edf8}
body.theme-dark main{background:#121c2e;border-color:#28344a}
body.theme-dark p{color:#a0aec4}
body.theme-dark input{background:#0b1220;color:#e7edf8;border-color:#344563}
body.theme-dark a{color:#9bb4ff}
body.theme-dark #status.ok{color:#9fe8c7}
</style>
</head>
<body>
<main>
  <a id="back" href="akun.html">← Kembali ke Akun</a>
  <h1>Ganti password</h1>
  <p id="intro">Buat password baru yang hanya kamu yang tahu. Minimal 10 karakter.</p>

  <form id="f" novalidate>
    <label for="oldPw">Password sekarang</label>
    <input id="oldPw" type="password" autocomplete="current-password" maxlength="200" required>

    <label for="newPw">Password baru</label>
    <input id="newPw" type="password" autocomplete="new-password" maxlength="200" required>

    <label for="newPw2">Ulangi password baru</label>
    <input id="newPw2" type="password" autocomplete="new-password" maxlength="200" required>

    <button id="go" type="submit">Simpan password</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
try { if (localStorage.getItem('inside-tkj4-theme') === 'dark') document.body.classList.add('theme-dark'); } catch (e) {}

const db = supabase.createClient(
  'https://teuqxfwqntkgemyukiju.supabase.co',
  'sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ'
);
const $ = (id) => document.getElementById(id);
const ADMIN_ROLES = ['ketua', 'wakil', 'sekretaris', 'bendahara', 'keamanan_kebersihan'];
const MIN_LEN = 10;
let user = null;

function say(msg, ok) { const s = $('status'); s.textContent = msg; s.className = ok ? 'ok' : ''; }

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) { location.replace('index.html'); return; }
  user = data.session.user;
  if (user.user_metadata && user.user_metadata.must_change_password === true) {
    $('intro').textContent = 'Ini login pertamamu. Ganti password awal dengan password barumu sebelum lanjut. Minimal 10 karakter.';
    $('back').style.display = 'none';
  }
})();

$('f').onsubmit = async (e) => {
  e.preventDefault();
  if (!user) return;
  const oldPw = $('oldPw').value, n1 = $('newPw').value, n2 = $('newPw2').value;

  if (!oldPw || !n1 || !n2) return say('Isi semua kolom.');
  if (n1.length < MIN_LEN) return say('Password baru minimal ' + MIN_LEN + ' karakter.');
  if (n1 !== n2) return say('Ulangi password baru dengan sama persis.');
  if (n1 === oldPw) return say('Password baru harus berbeda dari password sekarang.');

  const btn = $('go');
  btn.disabled = true;
  say('Memeriksa…');
  try {
    // pastikan yang ngetik memang tahu password sekarang
    const re = await db.auth.signInWithPassword({ email: user.email, password: oldPw });
    if (re.error) return say(re.error.status === 429 ? 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.' : 'Password sekarang salah.');

    const up = await db.auth.updateUser({ password: n1, data: { must_change_password: false } });
    if (up.error) {
      console.error(up.error);
      const c = up.error.code || '';
      if (c === 'weak_password') return say('Password terlalu lemah. Campur huruf besar, huruf kecil, dan angka.');
      if (c === 'same_password') return say('Password baru harus berbeda dari password sekarang.');
      return say('Gagal mengganti password. Coba lagi nanti.');
    }

    say('Password berhasil diganti. Mengalihkan…', true);
    const r = await db.from('profiles').select('role').eq('id', user.id).single();
    const dest = 'akun.html';
    setTimeout(() => { location.href = dest; }, 1200);
  } catch (err) {
    console.error(err);
    say('Terjadi kesalahan. Coba lagi nanti.');
  } finally {
    btn.disabled = false;
    $('oldPw').value = ''; $('newPw').value = ''; $('newPw2').value = '';
  }
};
</script>
</body>
</html>
