<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Pengurus — Inside TKJ 4</title>
<style>
body{font:15px system-ui;background:#f5f7fb;color:#18233c;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{background:white;border:1px solid #e6ebf4;border-radius:22px;padding:28px;max-width:430px;width:100%}
h1{margin:0 0 8px}
p{color:#71809b;line-height:1.7}
label{display:block;font-weight:700;margin:16px 0 6px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5f0;border-radius:11px}
button,.btn{width:100%;border:0;border-radius:11px;background:#4263eb;color:white;font-weight:800;padding:13px;margin-top:16px}
button:disabled{opacity:.6}
a{color:#4263eb}
#status{font-size:13px;color:#a23b3b;line-height:1.5}
body.theme-dark{color-scheme:dark;background:#0b1220;color:#e7edf8}
body.theme-dark main{background:#121c2e;border-color:#28344a}
body.theme-dark p{color:#a0aec4}
body.theme-dark input{background:#0b1220;color:#e7edf8;border-color:#344563}
body.theme-dark a{color:#9bb4ff}
#themeBtn{position:fixed;top:14px;right:14px;width:auto;margin:0;border:1px solid #dfe5f0;border-radius:10px;background:#fff;color:#26344d;padding:9px 12px;font-weight:800}
body.theme-dark #themeBtn{background:#243452;color:#e7edf8;border-color:#344563}
</style>
</head>
<body>
<button id="themeBtn" type="button">☾ Tema gelap</button>

<main>
  <a href="index.html">← Inside TKJ 4</a>
  <h1>Login pengurus</h1>
  <p>Masuk untuk mengelola profil siswa, portofolio, laporan kegiatan, pengumuman, dan tautan resmi.</p>

  <form id="f" novalidate>
    <label for="identity">Email atau username</label>
    <input id="identity" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="120" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" maxlength="200" required>

    <button id="go" type="submit">Masuk</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <p style="font-size:12px">Gunakan akun pengurus yang sudah dibuat untukmu. Jangan membagikan password.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---------- tema ----------
const themeKey = 'inside-tkj4-theme';
const themeBtn = document.getElementById('themeBtn');
function getTheme() { try { return localStorage.getItem(themeKey) || 'light'; } catch (e) { return 'light'; } }
function saveTheme(m) { try { localStorage.setItem(themeKey, m); } catch (e) {} }
function applyTheme(mode) {
  document.body.classList.toggle('theme-dark', mode === 'dark');
  themeBtn.textContent = mode === 'dark' ? '☀ Tema terang' : '☾ Tema gelap';
}
applyTheme(getTheme());
themeBtn.onclick = () => {
  const next = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
  saveTheme(next);
  applyTheme(next);
};

// ---------- login ----------
const db = supabase.createClient(
  'https://teuqxfwqntkgemyukiju.supabase.co',
  'sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ'
);

const ADMIN_ROLES = ['ketua', 'wakil', 'sekretaris', 'bendahara', 'keamanan_kebersihan'];

// satu pesan untuk semua kegagalan login, supaya akun tidak bisa ditebak
const MSG_SALAH = 'Email/username atau password salah.';
const MSG_LIMIT = 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
const MSG_ERROR = 'Terjadi kesalahan. Coba lagi nanti.';

function messageFor(status) {
  if (status === 429) return MSG_LIMIT;
  if (status === 400 || status === 401 || status === 422) return MSG_SALAH;
  return MSG_ERROR;
}
function fail(status, cause) { throw { status, cause }; }

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const pwInput = document.getElementById('password');
  const identity = document.getElementById('identity').value.trim();
  const password = pwInput.value;

  if (!identity || !password) { statusEl.textContent = MSG_SALAH; return; }

  btn.disabled = true;
  statusEl.textContent = 'Memeriksa akun…';
  let signedIn = false;

  try {
    let user;

    if (identity.includes('@')) {
      // login pakai email
      const { data, error } = await db.auth.signInWithPassword({ email: identity, password });
      if (error) fail(error.status, error);
      user = data.user;
    } else {
      // login pakai username lewat Edge Function
      const { data, error } = await db.functions.invoke('login-with-username', {
        body: { username: identity, password }
      });
      if (error) fail(error.context && error.context.status, error);
      if (!data || !data.access_token || !data.refresh_token) fail(401);

      const res = await db.auth.setSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token
      });
      if (res.error) fail(500, res.error);
      user = res.data.user;
    }
    signedIn = true;

    // ambil role, lalu arahkan ke dashboard yang sesuai
    const prof = await db.from('profiles').select('role').eq('id', user.id).single();
    if (prof.error) fail(500, prof.error);

    location.href = ADMIN_ROLES.includes(prof.data.role) ? 'dashboard.html' : 'member-dashboard.html';
  } catch (x) {
    // kalau sudah sempat masuk tapi gagal di tengah jalan, keluarkan lagi
    if (signedIn) { try { await db.auth.signOut(); } catch (e) {} }
    console.error('login gagal:', x && (x.cause || x));
    statusEl.textContent = messageFor(x && x.status);
    pwInput.value = '';
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
