<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Pengurus — Inside TKJ 4</title><style>body{font:15px system-ui;background:#f5f7fb;color:#18233c;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{background:white;border:1px solid #e6ebf4;border-radius:22px;padding:28px;max-width:430px;width:100%}h1{margin:0 0 8px}p{color:#71809b;line-height:1.7}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5f0;border-radius:11px}button,.btn{width:100%;border:0;border-radius:11px;background:#4263eb;color:white;font-weight:800;padding:13px;margin-top:16px}a{color:#4263eb}#status{font-size:13px;color:#a23b3b;line-height:1.5}body.theme-dark{color-scheme:dark;background:#0b1220;color:#e7edf8}body.theme-dark main{background:#121c2e;border-color:#28344a}body.theme-dark p{color:#a0aec4}body.theme-dark input{background:#0b1220;color:#e7edf8;border-color:#344563}body.theme-dark a{color:#9bb4ff}#themeBtn{position:fixed;top:14px;right:14px;border:1px solid #dfe5f0;border-radius:10px;background:#fff;color:#26344d;padding:9px 12px;font-weight:800}body.theme-dark #themeBtn{background:#243452;color:#e7edf8;border-color:#344563}</style></head><body><button id="themeBtn" type="button">☾ Tema gelap</button><main><a href="index.html">← Inside TKJ 4</a><h1>Login pengurus</h1><p>Masuk untuk mengelola profil siswa, portofolio, laporan kegiatan, pengumuman, dan tautan resmi.</p><form id="f"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="go">Masuk</button></form><p id="status" role="status"></p><p style="font-size:12px">Gunakan akun pengurus yang sudah dibuat di Supabase. Jangan membagikan password.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const themeKey='inside-tkj4-theme',themeBtn=document.getElementById('themeBtn');function applyTheme(mode){document.body.classList.toggle('theme-dark',mode==='dark');themeBtn.textContent=mode==='dark'?'☀ Tema terang':'☾ Tema gelap'}applyTheme(localStorage.getItem(themeKey)||'light');themeBtn.onclick=()=>{const next=document.body.classList.contains('theme-dark')?'light':'dark';localStorage.setItem(themeKey,next);applyTheme(next)};const db=supabase.createClient('https://teuqxfwqntkgemyukiju.supabase.co','sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ');document.getElementById('f').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('go'),s=document.getElementById('status');b.disabled=true;s.textContent='Memeriksa akun…';try{let {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;let r=await db.from('profiles').select('role').eq('id',data.user.id).single();if(r.error)throw r.error;if(!['ketua','wakil','sekretaris','bendahara','keamanan_kebersihan'].includes(r.data.role)){await db.auth.signOut();throw Error('Akun ini bukan akun pengurus.')}location.href='dashboard.html'}catch(x){s.textContent='Login gagal: '+x.message}finally{b.disabled=false}};</script></body></html>
