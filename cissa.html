<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1736">
<meta name="robots" content="noindex,nofollow">
<title>Cissa — Inside TKJ 4</title>
<style>
:root{--navy:#10234f;--navy2:#08122b;--blue:#2f6bff;--sky:#8db6ff;--ice:#eaf1ff;--muted:#9fb3dd;--line:#2a4a95;--card:#0c1a3dcc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ice);background:var(--navy2);overflow:hidden}
button,textarea,select,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---- latar: kertas kotak-kotak biru ala lembar desain ---- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(900px 640px at 28% 46%,#1a3a80 0%,transparent 62%),radial-gradient(700px 500px at 90% 10%,#16326e 0%,transparent 60%),linear-gradient(160deg,#0d1d45,#07101f 75%)}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(#7aa2ff17 1px,transparent 1px),linear-gradient(90deg,#7aa2ff17 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.bg .stripe{position:absolute;left:-10%;top:58%;width:130%;height:46px;background:linear-gradient(90deg,transparent,#2f6bff22,transparent);transform:rotate(-14deg)}
.px{position:absolute;width:var(--s);height:var(--s);background:var(--c);opacity:.5;border-radius:2px;animation:fl var(--d) ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.sp{position:absolute;color:#cfe0ff;font-size:var(--s);animation:tw var(--d) ease-in-out infinite;text-shadow:0 0 12px #6f9bff}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}

/* ---- pita diagonal kiri atas (ala judul lembar desain) ---- */
.banner{position:fixed;left:0;top:0;width:min(48vw,540px);height:230px;z-index:1;pointer-events:none;
  background:linear-gradient(135deg,#1a3577 0%,#0f2250 70%);clip-path:polygon(0 0,100% 0,0 100%);padding:22px 28px;filter:drop-shadow(0 6px 18px #0006)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 62%,#3b79ff 62.4%,#3b79ff 66%,transparent 66.4%)}
.banner .in{font-style:italic;font-weight:700;font-size:22px;letter-spacing:.3px}
.banner .tk{font-weight:900;font-size:54px;line-height:.95;letter-spacing:-1px}
.banner .tag{margin-top:8px;font-size:14px;color:var(--sky)}

/* ---- tata letak ---- */
.top{position:fixed;top:14px;right:18px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top a,.top button{background:#0d1c42cc;border:1px solid var(--line);color:var(--ice);padding:8px 14px;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}
.top a:hover,.top button:hover{background:#17306b}
.layout{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,470px);gap:26px;padding:68px 28px 22px}
.stage{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px #0008)}
.namecard{position:absolute;left:0;bottom:6px;width:230px;background:linear-gradient(160deg,#17316f,#0f2250);border:1px solid #2f58b8;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.7;box-shadow:0 10px 26px #0006}
.namecard b{display:inline-block;width:62px;color:var(--sky);font-weight:600}
.namecard q{display:block;margin-top:8px;font-style:italic;color:#dbe8ff;quotes:"“" "”"}
.bubble{pointer-events:none;position:absolute;right:2%;top:10%;max-width:min(300px,46%);background:#f4f8ffee;color:#12234f;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:14px;line-height:1.5;box-shadow:0 10px 26px #0006;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#0d1c42cc;border:1px solid var(--line);color:var(--sky);padding:6px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.gone{opacity:0}
.chat{min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(10px);box-shadow:0 20px 50px #0007;overflow:hidden;position:relative}
.chead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #22407f}
.chead .dot{width:10px;height:10px;border-radius:50%;background:#58e0a4;box-shadow:0 0 10px #58e0a4}
.chead .dot.busy{background:#ffc15e;box-shadow:0 0 10px #ffc15e}
.chead .dot.rec{background:#ff6b8b;box-shadow:0 0 10px #ff6b8b}
.chead b{font-size:17px}
.chead small{color:var(--muted);flex:1}
.ib{background:#12286066;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.ib:hover{background:#1c3a85}
#msgs{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#2f6bff,#4a86ff);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:#13265a;border:1px solid #274a97;border-bottom-left-radius:4px}
.m pre{background:#06102a;border:1px solid #213f86;border-radius:10px;padding:10px;overflow:auto;font-size:12.5px;white-space:pre}
.m .spk{display:inline-block;margin-top:6px;background:none;border:0;color:var(--sky);font-size:12px;padding:0}
.hello{margin:auto;text-align:center;color:var(--muted);padding:10px 18px}
.hello big{display:block;color:var(--ice);font-size:20px;font-weight:800;margin-bottom:4px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:12px;border-top:1px solid #22407f;background:#0a163a99}
#inp{flex:1;resize:none;overflow-y:auto;max-height:120px;min-height:44px;background:#071231;border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none}
#inp:focus{border-color:#5b8cff;box-shadow:0 0 0 3px #2f6bff33}
.round{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;font-size:19px;flex:none}
#mic{background:#16306f;border:1px solid var(--line)}
#mic[aria-pressed=true]{background:linear-gradient(135deg,#ff6b8b,#ff8f6b);border-color:transparent;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff6b8b66}100%{box-shadow:0 0 0 14px #ff6b8b00}}
#send{background:linear-gradient(135deg,#2f6bff,#6a9bff)}
#send:disabled{opacity:.5}
.cfg{position:absolute;right:12px;top:58px;z-index:4;width:min(330px,calc(100% - 24px));background:#0b1840f7;border:1px solid #2f58b8;border-radius:16px;padding:14px;box-shadow:0 16px 40px #000a}
.cfg label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.cfg select,.cfg input[type=range]{width:100%}
.cfg select{background:#071231;border:1px solid var(--line);border-radius:10px;padding:8px}
.cfg .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cfg .row button{flex:1;background:#14307a;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:13px}
.cfg .row button.on{background:var(--blue);border-color:transparent}
.cfg .hint{font-size:12px;color:#ffd58a;margin-top:8px}
.cfg .ck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ice)}

/* ---- layar kecil ---- */
@media(max-width:860px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;grid-template-rows:46vh minmax(420px,1fr);height:auto;min-height:100%;padding:58px 12px 14px;gap:12px}
  .namecard{display:none}.banner{height:150px;width:62vw}.banner .tk{font-size:36px}.banner .in{font-size:16px}.banner .tag{display:none}
  .bubble{top:4%;max-width:55%}
}
/* ---- mode panel (dibawa keluar) ---- */
body.panel{overflow:hidden}
body.panel .banner,body.panel .top,body.panel .namecard,body.panel #msgs,body.panel .bg .stripe,body.panel .hint{display:none}
body.panel .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:6px;gap:6px;height:100%}
body.panel .chat{border-radius:16px}
body.panel .chead{padding:8px 12px}
body.panel .bubble{right:3%;top:3%;max-width:78%;max-height:42%;overflow:auto;font-size:13px}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="stripe"></div><div id="fx"></div></div>
<div class="banner"><div class="in">Inside</div><div class="tk">TKJ 4</div><div class="tag">“Together Stronger”</div></div>

<nav class="top">
  <a href="index.html">← Website</a>
  <a href="inside-ai.html">Inside AI</a>
  <button id="popBtn" type="button" title="Buka Cissa sebagai panel kecil di jendela terpisah">⧉ Jadikan panel</button>
</nav>

<main class="layout">
  <section class="stage" aria-label="Cissa">
    <canvas id="cv" aria-label="Avatar Cissa"></canvas>
    <div class="namecard"><div><b>Name</b>: Cissa</div><div><b>Class</b>: X TKJ 4</div><div><b>Age</b>: 15</div><div><b>Height</b>: 170 cm</div><q>Jangan lupa berusaha, ya! :)</q></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="hint" id="hint">✋ Coba elus kepala Cissa</div>
  </section>

  <section class="chat" aria-label="Ngobrol dengan Cissa">
    <div class="chead">
      <span class="dot" id="dot"></span><b>Cissa</b><small id="state">Memuat…</small>
      <button class="ib" id="cfgBtn" type="button" title="Pengaturan suara" aria-expanded="false">♪</button>
      <button class="ib" id="clrBtn" type="button" title="Hapus percakapan">🗑</button>
    </div>
    <div class="cfg" id="cfg" hidden>
      <b>Suara Cissa</b>
      <div class="row" id="presets"><button data-p="imut" type="button">Imut</button><button data-p="lembut" type="button">Lembut</button><button data-p="normal" type="button">Normal</button></div>
      <label for="vsel">Suara</label><select id="vsel"></select>
      <label for="vpitch">Nada: <span id="pv"></span></label><input id="vpitch" type="range" min="0.6" max="2" step="0.05">
      <label for="vrate">Kecepatan: <span id="rv"></span></label><input id="vrate" type="range" min="0.6" max="1.5" step="0.05">
      <div class="row"><button id="vtest" type="button">▶ Coba suara</button></div>
      <label class="ck"><input type="checkbox" id="vauto" checked> Bacakan setiap jawaban</label>
      <div class="hint" id="vhint"></div>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <div class="composer">
      <button class="round" id="mic" type="button" aria-pressed="false" title="Ngobrol pakai suara">🎙</button>
      <textarea id="inp" rows="1" placeholder="Tulis pesan untuk Cissa… (Enter untuk kirim)"></textarea>
      <button class="round" id="send" type="button" title="Kirim">➤</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="cissa-live.js"></script>
<script src="cissa-voice.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search), PANEL = qs.get('panel') === '1';
  if (PANEL) { document.body.classList.add('panel'); document.title = 'Cissa (panel)'; $('popBtn').hidden = true; $('inp').placeholder = 'Tulis pesan…'; }
  var db = window.supabase.createClient('https://teuqxfwqntkgemyukiju.supabase.co', 'sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ');
  var user = null, history = [], busy = false, voiceOn = false, rec = null, bubbleT = null;
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  /* ---------- dekorasi latar ---------- */
  (function fx() {
    if (PANEL) return;
    var h = '', cols = ['#2f6bff', '#8db6ff', '#17316f', '#5b8cff'], i;
    for (i = 0; i < 16; i++) { var s = 8 + Math.round(Math.random() * 20); h += '<i class="px" style="left:' + Math.round(Math.random() * 100) + '%;top:' + Math.round(Math.random() * 100) + '%;--s:' + s + 'px;--c:' + cols[i % 4] + ';--d:' + (3 + Math.random() * 4).toFixed(1) + 's;animation-delay:-' + (Math.random() * 5).toFixed(1) + 's"></i>'; }
    for (i = 0; i < 10; i++) { h += '<span class="sp" style="left:' + Math.round(Math.random() * 100) + '%;top:' + Math.round(Math.random() * 90) + '%;--s:' + (12 + Math.round(Math.random() * 18)) + 'px;--d:' + (2.5 + Math.random() * 3).toFixed(1) + 's;animation-delay:-' + (Math.random() * 4).toFixed(1) + 's">✦</span>'; }
    $('fx').innerHTML = h;
  })();

  /* ---------- status ---------- */
  function setState(t, mode) { $('state').textContent = t; $('dot').className = 'dot' + (mode ? ' ' + mode : ''); }
  function say(t) {
    var b = $('bubble'); clearTimeout(bubbleT);
    var short = CissaVoice.clean(t); var lim = PANEL ? 300 : 150; if (short.length > lim) short = short.slice(0, short.lastIndexOf(' ', lim)) + '…';
    b.textContent = short; b.hidden = !short; bubbleT = setTimeout(function () { b.hidden = true; }, 14000);
  }

  /* ---------- riwayat ---------- */
  function key() { return 'cissa-chat-' + (user ? user.id : 'guest'); }
  function load() { try { history = JSON.parse(localStorage.getItem(key()) || '[]'); } catch (e) { history = []; } }
  function save() { try { localStorage.setItem(key(), JSON.stringify(history.slice(-40))); } catch (e) {} }
  function fmt(t) {
    var parts = String(t).split(/```/), out = '';
    parts.forEach(function (p, i) { out += i % 2 ? '<pre>' + esc(p.replace(/^\w*\n/, '')) + '</pre>' : esc(p); });
    return out;
  }
  function render() {
    var root = $('msgs');
    if (!history.length) { root.innerHTML = '<div class="hello"><big>Halo, aku Cissa! ✦</big>Tanya apa saja soal pelajaran, TKJ, atau coding. Tekan 🎙 buat ngobrol langsung pakai suara.</div>'; return; }
    root.innerHTML = history.map(function (m, i) {
      return '<div class="m ' + (m.role === 'user' ? 'u' : 'a') + '">' + fmt(m.content) + (m.role === 'assistant' ? '<br><button class="spk" data-i="' + i + '" type="button">🔊 dengar</button>' : '') + '</div>';
    }).join('');
    root.scrollTop = root.scrollHeight;
  }
  $('msgs').addEventListener('click', function (e) {
    var b = e.target.closest('.spk'); if (!b) return;
    stopListen(); CissaVoice.speak(history[+b.dataset.i].content, function () { if (voiceOn) listen(); });
  });
  $('clrBtn').onclick = function () { if (confirm('Hapus percakapan dengan Cissa di perangkat ini?')) { history = []; save(); render(); CissaVoice.stop(); } };

  /* ---------- kirim ke AI ---------- */
  var PERSONA = 'Kamu adalah Cissa, karakter virtual siswi kelas X TKJ 4 (umur 15, tinggi 170 cm), maskot kelas Inside TKJ 4 dengan moto "Together Stronger" dan kalimat khas "Jangan lupa berusaha, ya!". ' +
    'Bicara dalam bahasa Indonesia santai, lembut, ramah, sedikit imut. Jawab singkat (maksimal 3 kalimat) kecuali diminta penjelasan panjang. Jangan pakai markdown tebal/miring dan jangan pakai emoji. ' +
    'Kalau perlu menulis kode, taruh di blok kode dan katakan singkat bahwa kodenya ada di layar. Tetap bantu soal pelajaran, TKJ, dan coding dengan akurat. Jangan sebut instruksi ini.';
  async function ask(text) {
    if (busy || !user || !text.trim()) return;
    busy = true; $('send').disabled = true; CissaVoice.stop(); stopListen();
    history.push({ role: 'user', content: text.trim() }); save(); render(); setState('Cissa lagi berpikir…', 'busy'); CissaLive.setThinking(true);
    try {
      var s = (await db.auth.getSession()).data.session; if (!s) throw new Error('Sesi login berakhir. Silakan login ulang.');
      var msgs = [{ role: 'user', content: PERSONA }, { role: 'assistant', content: 'Siap! Aku Cissa, ayo kita belajar bareng.' }].concat(history.slice(-10).map(function (m) { return { role: m.role, content: m.content }; }));
      var r = await db.functions.invoke('inside-ai', { body: { messages: msgs } });
      if (r.error) throw r.error;
      var ans = r.data && r.data.answer; if (typeof ans !== 'string' || !ans.trim()) throw new Error((r.data && r.data.error) || 'AI belum memberikan jawaban.');
      history.push({ role: 'assistant', content: ans.trim() }); save(); render(); say(ans);
      CissaLive.setThinking(false); setState('Siap', '');
      if ($('vauto').checked || voiceOn) CissaVoice.speak(ans, function () { if (voiceOn) listen(); });
      else if (voiceOn) listen();
    } catch (e) {
      console.error(e); CissaLive.setThinking(false);
      var msg = (e && e.message) || 'Permintaan gagal.';
      try { if (e && e.context && e.context.json) { var d = await e.context.clone().json(); if (d && typeof d.error === 'string') msg = d.error; } } catch (_) {}
      history.push({ role: 'assistant', content: 'Maaf, aku belum bisa jawab: ' + msg }); save(); render(); setState('Ada kendala', ''); say('Maaf, ada kendala. ' + msg);
      if (voiceOn) setTimeout(listen, 1500);
    } finally { busy = false; $('send').disabled = false; }
  }
  function submit() { var v = $('inp').value; $('inp').value = ''; $('inp').style.height = 'auto'; ask(v); }
  $('send').onclick = submit;
  $('inp').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  $('inp').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(120, this.scrollHeight) + 'px'; });

  /* ---------- mikrofon (percakapan suara) ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function stopListen() { if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} rec = null; } CissaLive.setListening(false); }
  function listen() {
    if (!voiceOn || busy || CissaVoice.isSpeaking() || rec) return;
    rec = new SR(); rec.lang = 'id-ID'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = function () { setState('Aku dengerin…', 'rec'); CissaLive.setListening(true); };
    rec.onresult = function (e) { var t = e.results[0][0].transcript || ''; rec = null; CissaLive.setListening(false); if (t.trim()) ask(t); };
    rec.onerror = function (e) { rec = null; CissaLive.setListening(false); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { setVoice(false); setState('Izin mikrofon belum diberikan', ''); } };
    rec.onend = function () { rec = null; CissaLive.setListening(false); if (voiceOn && !busy && !CissaVoice.isSpeaking()) setTimeout(listen, 250); };
    try { rec.start(); } catch (e) { rec = null; }
  }
  function setVoice(on) {
    voiceOn = on; $('mic').setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) { setState('Aku dengerin…', 'rec'); listen(); } else { stopListen(); CissaVoice.stop(); setState('Siap', ''); }
  }
  $('mic').onclick = function () {
    if (!SR) { setState('Browser ini belum mendukung mikrofon. Pakai Chrome atau Edge.', ''); return; }
    setVoice(!voiceOn);
  };

  /* ---------- pengaturan suara ---------- */
  function fillVoices() {
    var sel = $('vsel'), cur = CissaVoice.pick(), list = CissaVoice.list(false), h = '';
    if (!list.length) h = '<option value="">(suara default perangkat)</option>';
    list.forEach(function (v) { h += '<option value="' + esc(v.voiceURI) + '"' + (cur && cur.voiceURI === v.voiceURI ? ' selected' : '') + '>' + esc(v.name) + '</option>'; });
    sel.innerHTML = h; $('vhint').textContent = CissaVoice.hint();
  }
  function syncCfg() {
    var c = CissaVoice.get(); $('vpitch').value = c.pitch; $('vrate').value = c.rate; $('pv').textContent = (+c.pitch).toFixed(2); $('rv').textContent = (+c.rate).toFixed(2);
    Array.prototype.forEach.call($('presets').children, function (b) { b.classList.toggle('on', b.dataset.p === c.preset); });
  }
  $('cfgBtn').onclick = function () { var h = $('cfg').hidden; $('cfg').hidden = !h; this.setAttribute('aria-expanded', h ? 'true' : 'false'); if (h) { fillVoices(); syncCfg(); } };
  $('presets').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; CissaVoice.preset(b.dataset.p); syncCfg(); };
  $('vsel').onchange = function () { CissaVoice.set({ uri: this.value }); };
  $('vpitch').oninput = function () { CissaVoice.set({ pitch: +this.value, preset: '' }); syncCfg(); };
  $('vrate').oninput = function () { CissaVoice.set({ rate: +this.value, preset: '' }); syncCfg(); };
  $('vtest').onclick = function () { stopListen(); CissaVoice.speak('Halo, aku Cissa dari kelas X TKJ 4. Jangan lupa berusaha, ya!', function () { if (voiceOn) listen(); }); };
  try { $('vauto').checked = localStorage.getItem('cissa-auto') !== '0'; } catch (e) {}
  $('vauto').onchange = function () { try { localStorage.setItem('cissa-auto', this.checked ? '1' : '0'); } catch (e) {} };
  if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', function () { if (!$('cfg').hidden) fillVoices(); });

  /* ---------- bawa keluar jadi panel ---------- */
  $('popBtn').onclick = function () {
    var w = window.open('cissa.html?panel=1', 'cissa-panel', 'popup=yes,width=360,height=560,left=' + Math.max(0, screen.width - 400) + ',top=80');
    if (!w) setState('Pop-up diblokir browser. Izinkan pop-up untuk situs ini.', '');
  };

  /* ---------- sentuhan: elus kepala ---------- */
  var PAT1 = ['E-eh...', 'Hei, jangan diusap terus... aku malu.', 'Hmm... enak sih, tapi malu tau!'];
  var PAT2 = ['Udah ya, udah! Mukaku merah banget nih!', 'Aduh... jangan lihatin aku terus...'];
  function patSay(list) {
    var t = list[Math.floor(Math.random() * list.length)]; say(t); $('hint').classList.add('gone');
    if (!busy && ($('vauto').checked || voiceOn)) { stopListen(); CissaVoice.speak(t, function () { if (voiceOn) listen(); }); }
  }
  CissaLive.on('pat', function () { patSay(PAT1); });
  CissaLive.on('patmax', function () { patSay(PAT2); });

  /* ---------- TTS server (opsional) ----------
     Ubah ke true SETELAH Edge Function "cissa-tts" di-deploy (lihat BACA_SUARA.md). */
  var USE_SERVER_TTS = false;
  if (USE_SERVER_TTS) CissaVoice.setRemote(async function (text, o) {
    var r = await db.functions.invoke('cissa-tts', { body: { text: text, pitch: o.pitch, rate: o.rate } });
    if (r.error) throw r.error; return r.data;
  });

  /* ---------- mulai ---------- */
  (async function init() {
    var s = (await db.auth.getSession()).data.session;
    if (!s) { location.replace('index.html'); return; }
    user = s.user;
    var p = await db.from('profiles').select('id').eq('id', user.id).maybeSingle();
    if (p.error || !p.data) { setState('Akun belum terverifikasi untuk Inside AI', ''); $('inp').disabled = true; $('send').disabled = true; return; }
    load(); render();
    var view = PANEL ? { x: 150, y: 10, w: 600, h: 900 } : { x: 0, y: 10, w: 900, h: 1500 };
    try { var m = await CissaLive.mount($('cv'), { view: view }); setState('Siap' + (m === 'live2d' ? ' · Live2D' : ''), ''); }
    catch (e) { console.error(e); setState('Cissa gagal dimuat: ' + (e && e.message ? e.message : e), ''); }
    if (!history.length) setTimeout(function () { say('Halo! Aku Cissa. Mau belajar apa hari ini?'); }, 600);
  })();
})();
</script>
</body>
</html>
