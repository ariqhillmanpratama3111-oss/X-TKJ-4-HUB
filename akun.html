<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://teuqxfwqntkgemyukiju.supabase.co; connect-src 'self' https://teuqxfwqntkgemyukiju.supabase.co wss://teuqxfwqntkgemyukiju.supabase.co; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Akun — Inside TKJ 4</title>
<style>
*{box-sizing:border-box}
body{font:15px system-ui;background:#0b1220;color:#e7edf8;margin:0}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;position:sticky;top:0;background:#0b1220e6;backdrop-filter:blur(8px);z-index:5}
.top a,.top button{background:none;border:0;color:#e7edf8;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;padding:10px 12px;border-radius:10px}
.top button{color:#a0aec4}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}
.me{text-align:center;padding:8px 0 18px}
.avwrap{position:relative;width:112px;height:112px;margin:0 auto 12px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;display:block}
.avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font:800 46px system-ui;color:#fff;background:linear-gradient(135deg,#4263eb,#7c3aed)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avwrap.busy .avatar{opacity:.45}
.cam{position:absolute;right:0;bottom:2px;width:34px;height:34px;border-radius:50%;background:#4263eb;border:3px solid #0b1220;display:grid;place-items:center;font-size:15px}
h1{margin:6px 0 0;font-size:24px;overflow-wrap:anywhere}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pill{background:#182540;color:#e7edf8;border:1px solid #28344a;border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
.sec{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}
.sec h2{margin:0;font-size:17px}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:#4263eb;color:#fff;font-size:24px;line-height:1;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{position:relative;background:#121c2e;border:1px solid #28344a;border-radius:16px;overflow:hidden}
.pc .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#243452,#1a2540);display:grid;place-items:center;font:800 34px system-ui;color:#7d8fb5}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .tx{padding:10px 12px}.pc b{display:block;font-size:14px;overflow-wrap:anywhere}.pc small{color:#a0aec4}
.pc .del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer}
.empty{color:#a0aec4;text-align:center;padding:24px 10px;border:1px dashed #344563;border-radius:16px;line-height:1.8}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.box{background:#121c2e;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 18px 28px}
.box h3{margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:#a0aec4;font-size:22px;cursor:pointer}
label{display:block;font-weight:750;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid #344563;border-radius:10px;padding:12px;font:inherit;background:#0b1220;color:#e7edf8}
textarea{min-height:90px}
.btn{border:0;border-radius:11px;padding:12px 16px;background:#4263eb;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:14px;width:100%}
.btn:disabled{opacity:.6}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.st{color:#ff9b9b;font-size:13px;min-height:1em;margin-top:8px}.st.ok{color:#9fe8c7}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#243452;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:30;display:none}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><a href="index.html">‹ Beranda</a><button id="logout" type="button">Keluar</button></div>
<div class="wrap">
 <div class="me">
  <button class="avwrap" id="avBtn" type="button" aria-label="Ganti foto profil"><div class="avatar" id="av">?</div><span class="cam">📷</span></button>
  <input id="avFile" type="file" accept="image/*" hidden>
  <h1 id="nm">…</h1>
  <div class="pills"><button class="pill" id="nameBtn" type="button">✎ Ubah nama</button><a class="pill" href="ganti-password.html">🔑 Ganti password</a><a class="pill" id="dashLink" href="dashboard.html" hidden>▦ Dashboard</a></div>
 </div>
 <div class="sec"><h2>Portofolio saya</h2><button class="plus" id="addBtn" type="button" aria-label="Tambah portofolio" hidden>＋</button></div>
 <div id="list"></div>
</div>

<div class="sheet" id="nameSheet"><div class="box"><h3>Ubah nama <button class="x" data-close type="button" aria-label="Tutup">✕</button></h3>
 <p style="color:#a0aec4;margin:4px 0 0;font-size:13px">Nama ini tampil di profilmu. Username untuk login tidak berubah.</p>
 <label for="nameIn">Nama akun</label><input id="nameIn" maxlength="60" autocomplete="off">
 <button class="btn" id="nameSave" type="button">Simpan</button><div class="st" id="nameSt" role="status"></div></div></div>

<div class="sheet" id="addSheet"><div class="box"><h3>Tambah portofolio <button class="x" data-close type="button" aria-label="Tutup">✕</button></h3>
 <form id="pf"><label for="ttl">Judul karya</label><input id="ttl" name="title" required maxlength="150">
 <div class="g2"><div><label for="cat">Kategori</label><select id="cat" name="category"><option>Programming</option><option>Jaringan</option><option>Desain grafis</option><option>Fotografi</option><option>Video editing</option><option>Robotika</option><option>Lainnya</option></select></div>
 <div><label for="lnk">Link karya (opsional)</label><input id="lnk" name="link_url" type="url" placeholder="https://..."></div></div>
 <label for="img">Gambar karya (opsional, maks. 8 MB)</label><input id="img" name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
 <label for="dsc">Deskripsi</label><textarea id="dsc" name="description" required maxlength="2000"></textarea>
 <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="is_public" checked style="width:auto"> Tampilkan secara publik</label>
 <button class="btn" id="save">Terbitkan</button></form><div class="st" id="addSt" role="status"></div></div></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://teuqxfwqntkgemyukiju.supabase.co','sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ADMIN=['ketua','wakil','sekretaris','bendahara','keamanan_kebersihan'];
let user,profile,tt;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
function st(id,m,ok){const e=$(id);e.textContent=m;e.className='st'+(ok?' ok':'')}
function errMsg(x){console.error(x);const c=x&&x.code,m=String(x&&x.message||'');if(/^(Pilih file|Ukuran gambar)/.test(m))return m;if(c==='42501'||/row-level security|permission denied/i.test(m))return 'Kamu tidak punya izin untuk aksi ini.';if(/mime|not supported/i.test(m))return 'Format gambar tidak didukung.';if(/exceed|too large|size/i.test(m))return 'Ukuran file terlalu besar.';if(c==='23514'||c==='22001')return 'Data tidak valid: cek panjang teks dan format link.';return 'Terjadi kesalahan. Coba lagi nanti.'}
async function uploadImage(file,folder){if(!file||!file.name)return null;if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw new Error('Pilih file gambar JPG, PNG, WebP, atau GIF.');if(file.size>8*1024*1024)throw new Error('Ukuran gambar maksimal 8 MB.');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[file.type];const path=`${folder}/${user.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('inside-tkj4').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(up.error)throw up.error;return db.storage.from('inside-tkj4').getPublicUrl(path).data.publicUrl}
const rmFile=async u=>{try{const p=(u||'').split('/inside-tkj4/')[1];if(p)await db.storage.from('inside-tkj4').remove([p])}catch(_){}};
const name=()=>profile.display_name||profile.username||user.email||'Siswa';
function render(){const n=name();$('nm').textContent=n;const av=$('av');av.textContent='';if(profile.avatar_url){const im=document.createElement('img');im.alt='Foto profil';im.src=profile.avatar_url;im.onerror=()=>{av.textContent=n.trim().charAt(0).toUpperCase()||'?'};av.appendChild(im)}else av.textContent=n.trim().charAt(0).toUpperCase()||'?'}
const open=id=>$(id).classList.add('open'),shut=()=>document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=shut);document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)shut()}));
async function start(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace('index.html');return}user=data.session.user;if(user.user_metadata&&user.user_metadata.must_change_password===true){location.replace('ganti-password.html');return}
const p=await db.from('profiles').select('role,display_name,username,avatar_url').eq('id',user.id).single();if(p.error||!p.data){$('nm').textContent='Akun belum siap';return}
profile=p.data;render();if(ADMIN.includes(profile.role))$('dashLink').hidden=false;await load()}
async function load(){const r=await db.from('portfolios').select('id,title,category,is_public,image_url').eq('created_by',user.id).order('created_at',{ascending:false});const L=$('list');
if(r.error){L.innerHTML='<div class="empty">Gagal memuat karya.</div>';$('addBtn').hidden=true;return}
const rows=r.data||[];$('addBtn').hidden=!rows.length;
if(!rows.length){L.innerHTML='<div class="empty">Belum ada karya.<br><button class="pill" id="addEmpty" type="button">＋ Tambah karya</button></div>';$('addEmpty').onclick=()=>open('addSheet');return}
L.innerHTML='<div class="grid">'+rows.map(x=>`<div class="pc"><div class="ph">${x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:esc((x.title||'?').charAt(0).toUpperCase())}</div><div class="tx"><b>${esc(x.title)}</b><small>${esc(x.category)} · ${x.is_public?'Publik':'Draft'}</small></div><button class="del" type="button" data-del="${esc(x.id)}" data-img="${esc(x.image_url||'')}" aria-label="Hapus">🗑</button></div>`).join('')+'</div>';
L.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus karya ini?'))return;const d=await db.from('portfolios').delete().eq('id',b.dataset.del).eq('created_by',user.id);if(d.error){toast(errMsg(d.error));return}rmFile(b.dataset.img);toast('Karya dihapus.');await load()})}
$('addBtn').onclick=()=>open('addSheet');
// foto profil: ketuk foto -> pilih -> otomatis dipotong persegi
async function squareJpeg(file){const bm=await createImageBitmap(file);const s=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,512,512);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return new File([blob],'avatar.jpg',{type:'image/jpeg'})}
$('avBtn').onclick=()=>$('avFile').click();
$('avFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/^image\//.test(f.type)){toast('Pilih file gambar.');return}$('avBtn').classList.add('busy');try{const old=profile.avatar_url,url=await uploadImage(await squareJpeg(f),'avatars');const r=await db.from('profiles').update({avatar_url:url}).eq('id',user.id);if(r.error)throw r.error;profile.avatar_url=url;render();rmFile(old);toast('Foto profil diperbarui.')}catch(x){toast('Gagal: '+errMsg(x))}finally{$('avBtn').classList.remove('busy')}};
// ubah nama tampilan
$('nameBtn').onclick=()=>{$('nameIn').value=profile.display_name||'';st('nameSt','');open('nameSheet');setTimeout(()=>$('nameIn').focus(),80)};
$('nameSave').onclick=async()=>{const v=$('nameIn').value.trim();if(!v){st('nameSt','Nama tidak boleh kosong.');return}$('nameSave').disabled=true;try{const r=await db.from('profiles').update({display_name:v}).eq('id',user.id);if(r.error)throw r.error;profile.display_name=v;render();shut();toast('Nama diperbarui.')}catch(x){st('nameSt','Gagal: '+errMsg(x))}finally{$('nameSave').disabled=false}};
// tambah portofolio
$('pf').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;st('addSt','Menyimpan…',true);try{const f=new FormData(e.target);const row={title:f.get('title').trim(),student_name:name(),category:f.get('category'),image_url:await uploadImage(f.get('image_file'),'portfolios'),link_url:f.get('link_url')||null,description:f.get('description').trim(),is_public:f.has('is_public'),created_by:user.id};const r=await db.from('portfolios').insert(row);if(r.error)throw r.error;e.target.reset();$('pf').elements.is_public.checked=true;st('addSt','');shut();toast('Karya diterbitkan!');await load()}catch(x){st('addSt','Gagal: '+errMsg(x))}finally{b.disabled=false}};
$('logout').onclick=async()=>{if(!confirm('Keluar dari akun ini?'))return;await db.auth.signOut();location.href='index.html'};
start();
</script></body></html>
