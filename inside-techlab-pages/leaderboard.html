<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard · Inside TechLab</title><style>*{box-sizing:border-box}body{margin:0;background:#070d18;color:#eaf4ff;font-family:Inter,Arial,sans-serif}a{color:inherit}.top{height:auto;min-height:72px;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #26364b;background:#0a1322;position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#35e7ff}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #35e7ff66;border-radius:9px;background:#102238;color:#8df4ff;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;font-size:11px}.btn.primary{background:linear-gradient(100deg,#35e7ff,#83f4ff);color:#061018;border:0}.muted{color:#91a4bd}.wrap{width:min(980px,92%);margin:34px auto 70px}.kicker{font:700 10px Arial;letter-spacing:2px;color:#35e7ff}.hero h1{font-size:clamp(27px,5vw,42px);margin:10px 0}.panel{margin-top:22px;padding:22px;border:1px solid #26364b;border-radius:15px;background:linear-gradient(145deg,#101d30,#0b1120)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,textarea,select{width:100%;max-width:100%;padding:12px;border:1px solid #34445b;border-radius:9px;background:#081321;color:#eaf4ff;margin:7px 0 14px;font:inherit}.input.small{max-width:360px}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}.stat{padding:16px;background:#0a1525;border:1px solid #26364b;border-radius:10px}.stat b{display:block;font-size:22px;color:#35e7ff}.stat small{color:#91a4bd}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #26364b;border-radius:10px;background:#0a1525;margin:9px 0;width:100%;text-align:left;color:inherit}.item.click{cursor:pointer}.item.click:hover{border-color:#35e7ff}.notice{font-size:12px;color:#91a4bd;line-height:1.6}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:30}.modal.show{display:grid}.modalbox{width:min(430px,100%);padding:22px;border:1px solid #35e7ff66;border-radius:15px;background:#0d192a}.status{font-size:11px;color:#7cefc1}.profile{margin-top:18px;padding:18px;border:1px solid #35e7ff55;border-radius:12px;background:#0b1828}@media(max-width:560px){.top{align-items:flex-start;flex-direction:column}.wrap{margin-top:24px}.panel{padding:16px}}</style></head><body>
<header class="top"><a class="brand" href="index.html" style="text-decoration:none">INSIDE <span>TECHLAB</span></a><div class="actions"><span class="status" id="sessionState">GUEST MODE</span><a class="btn" href="index.html">← OVERVIEW</a></div></header>
<main class="wrap"><div class="hero"><div class="kicker">TECHLAB / COMMUNITY</div><h1>Leaderboard</h1><p class="muted">Peringkat pengguna berdasarkan XP dari misi TechLab yang berhasil diselesaikan.</p></div><section class="panel"><div class="row" style="justify-content:space-between"><div><h2>Top Learners</h2><p class="notice">Klik nama pengguna untuk membuka profilnya.</p></div><button class="btn" id="refresh">MUAT ULANG ↻</button></div><div id="leaders" class="notice">Memuat leaderboard...</div><div id="publicProfile" class="profile hidden"></div></section></main>
<script>
const SUPABASE_URL='https://teuqxfwqntkgemyukiju.supabase.co';
const KEY='sb_publishable_0XsVO6d21dYZaDtWHoGyGQ_spE3LXbQ';
const STORAGE_KEY='sb-teuqxfwqntkgemyukiju-auth-token';
let sb=null,user=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateSessionUI(){
  const el=$('sessionState');
  if(el) el.textContent=user?(user.email||'SIGNED IN'):'BELUM LOGIN';
}
async function loadSupabaseLibrary(){
  if(window.supabase?.createClient) return true;
  const sources=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'
  ];
  for(const src of sources){
    try{
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src=src;
        script.async=true;
        script.onload=()=>resolve();
        script.onerror=()=>reject(new Error('Gagal memuat '+src));
        document.head.appendChild(script);
      });
      if(window.supabase?.createClient) return true;
    }catch(error){
      console.warn('[Inside TechLab] '+error.message);
    }
  }
  return false;
}
async function initCommunitySupabase(){
  const state=$('sessionState');
  if(state) state.textContent='MENGHUBUNGKAN...';
  const loaded=await loadSupabaseLibrary();
  if(!loaded){
    if(state) state.textContent='LIBRARY ERROR';
    const status=$('pageStatus')||$('dashStatus')||$('feedbackStatus')||$('results')||$('leaders');
    if(status) status.textContent='Library Supabase gagal dimuat dari kedua CDN. Periksa koneksi internet lalu muat ulang.';
    return false;
  }
  try{
    sb=window.supabase.createClient(SUPABASE_URL,KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        storageKey:STORAGE_KEY
      }
    });
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    user=data.session?.user||null;
    updateSessionUI();
    sb.auth.onAuthStateChange((_event,session)=>{
      user=session?.user||null;
      updateSessionUI();
      if(typeof window.onCommunityAuthChange==='function'){
        Promise.resolve(window.onCommunityAuthChange()).catch(err=>console.error(err));
      }
    });
    return true;
  }catch(error){
    if(state) state.textContent='AUTH ERROR';
    const status=$('pageStatus')||$('dashStatus')||$('feedbackStatus')||$('results')||$('leaders');
    if(status) status.textContent='Gagal menginisialisasi atau membaca sesi Supabase: '+error.message;
    console.error('[Inside TechLab] Supabase init:',error);
    return false;
  }
}

async function openProfile(id){if(!sb){$('leaders').textContent='Supabase tidak siap.';return;}const box=$('publicProfile');box.classList.remove('hidden');box.innerHTML='Memuat profil...';const [pr,pg]=await Promise.all([sb.from('techlab_profiles').select('id,display_name').eq('id',id).maybeSingle(),sb.from('techlab_progress').select('module_key,xp,completed').eq('user_id',id).eq('completed',true)]);if(pr.error||pg.error||!pr.data){box.textContent='Profil tidak dapat dimuat: '+(pr.error?.message||pg.error?.message||'Tidak ditemukan');return;}const rows=pg.data||[],xp=rows.reduce((a,r)=>a+(Number(r.xp)||0),0);box.innerHTML='<h2>'+esc(pr.data.display_name||'Someone')+'</h2><div class="statgrid"><div class="stat"><b>'+xp+'</b><small>XP</small></div><div class="stat"><b>'+rows.length+'</b><small>MISI SELESAI</small></div><div class="stat"><b>'+(Math.floor(xp/100)+1)+'</b><small>LEVEL</small></div></div>'+(user&&user.id!==id?'<button class="btn primary" id="friendReq">KIRIM PERMINTAAN TEMAN</button><p class="notice" id="friendMsg"></p>':'');if($('friendReq'))$('friendReq').onclick=async()=>{const {error}=await sb.from('techlab_friendships').insert({requester_id:user.id,addressee_id:id,status:'pending'});$('friendMsg').textContent=error?'Tidak dapat mengirim: '+error.message:'Permintaan teman terkirim.';};}async function loadLeaders(){if(!sb){$('leaders').textContent='Supabase tidak siap. Muat ulang halaman dan periksa koneksi.';return;}$('leaders').textContent='Mengambil peringkat...';try{const result=await Promise.race([sb.rpc('techlab_leaderboard'),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Waktu koneksi habis (12 detik). Periksa koneksi atau Supabase.')),12000))]);const {data,error}=result;if(error)throw error;$('leaders').innerHTML=(data||[]).length?(data||[]).slice(0,50).map((r,i)=>'<button class="item click" data-id="'+esc(r.user_id)+'"><b>#'+(i+1)+' · '+esc(r.display_name||'TechLab User')+'</b><span>'+Number(r.total_xp||0)+' XP</span></button>').join(''):'Belum ada data XP.';}catch(e){$('leaders').textContent='Leaderboard gagal dimuat: '+(e.message||'Kesalahan tidak diketahui');}}$('leaders').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openProfile(b.dataset.id);};$('refresh').onclick=loadLeaders;

(async()=>{if(await initCommunitySupabase()){await loadLeaders();}})();
</script></body></html>
