<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101b33">
  <meta name="description" content="Inside TKJ 4 — cerita, kegiatan, dan karya satu kelas.">
  <title>Inside TKJ 4</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}
    #site{display:block;width:100%;height:100%;border:0;background:#f5f7fb}
    #fallback{display:none;position:fixed;inset:0;z-index:5;background:#101b33;color:#fff;
      font:15px system-ui,sans-serif;padding:28px;align-items:center;justify-content:center;text-align:center}
    #fallback.show{display:flex}
    #fallback a{color:#c8f7e5}
  </style>
</head>
<body>
  <!--
    PENTING:
    Sebelum memakai file ini, ubah nama index.html lama menjadi home.html.
    File home.html adalah homepage lama lengkap beserta seluruh fiturnya.
  -->
  <iframe id="site" src="home.html" title="Inside TKJ 4"></iframe>
  <div id="fallback">
    <div>
      <h2>Homepage Inside TKJ 4 belum ditemukan.</h2>
      <p>Pastikan file homepage lama sudah diubah namanya menjadi <b>home.html</b>
      dan berada satu folder dengan index.html ini.</p>
      <p><a href="home.html">Buka homepage lama</a></p>
    </div>
  </div>
  <script>
    const frame = document.getElementById('site');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('error', () => {
      frame.style.display = 'none';
      fallback.classList.add('show');
    });

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body || !doc.body.children.length) throw new Error('Homepage tidak termuat');

        // Arahkan semua tombol/menu TechLab ke landing page TechLab baru.
        doc.querySelectorAll('a[href]').forEach(link => {
          const raw = (link.getAttribute('href') || '').trim();
          if (/^(?:\.\/)?techlab\.html(?:[?#].*)?$/i.test(raw)) {
            link.setAttribute('href', 'inside-techlab-pages/');
          }
        });

        // Pastikan judul tab tetap memakai nama website utama.
        document.title = 'Inside TKJ 4';
      } catch (err) {
        console.warn('Tidak dapat menyesuaikan navigasi homepage:', err);
      }
    });
  </script>
</body>
</html>
